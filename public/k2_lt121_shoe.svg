<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Studio Isolated Background -->
  <rect width="800" height="600" fill="#ECECEC"/>
  <ellipse cx="400" cy="460" rx="320" ry="40" fill="#D2D2D2" opacity="0.6"/>
  <ellipse cx="400" cy="455" rx="260" ry="25" fill="#BCBCBC" opacity="0.4"/>

  <!-- Left Shoe (Background) -->
  <g transform="translate(110, 150) scale(0.82) rotate(-8)">
    <!-- Outsole Bottom (Gum) -->
    <path d="M 120 340 C 120 340, 180 375, 290 375 C 400 375, 480 330, 480 330 L 475 315 C 475 315, 390 355, 280 355 C 180 355, 125 325, 125 325 Z" fill="#966B43"/>
    <!-- Midsole (White) -->
    <path d="M 115 325 C 115 325, 175 358, 285 358 C 395 358, 485 315, 485 315 L 480 280 C 480 280, 390 315, 285 315 C 175 315, 120 285, 120 285 Z" fill="#F4F4F4"/>
    <!-- Upper Body (Navy) -->
    <path d="M 120 285 C 110 260, 130 190, 200 170 C 260 155, 310 130, 360 140 C 410 150, 470 210, 480 280 C 410 315, 285 315, 120 285 Z" fill="#1C2333"/>
    <!-- Toe Cap -->
    <path d="M 120 285 C 110 260, 130 220, 180 215 C 180 215, 170 285, 120 285 Z" fill="#141926"/>
    <!-- Collar White Interior -->
    <path d="M 330 145 C 350 120, 400 130, 420 170 C 410 180, 360 180, 330 145 Z" fill="#EAEAEA"/>
  </g>

  <!-- Right Shoe (Foreground Primary) -->
  <g transform="translate(140, 90)">
    <!-- Shadow beneath main shoe -->
    <path d="M 120 440 C 200 475, 360 480, 520 420 C 440 400, 260 400, 120 440 Z" fill="#A8A8A8" opacity="0.5"/>

    <!-- Outsole Bottom Tread (Gum Brown) -->
    <path d="M 110 425 C 130 445, 230 468, 360 465 C 470 460, 535 400, 535 400 L 530 380 C 530 380, 450 440, 350 445 C 230 448, 120 410, 120 410 Z" fill="#8B5E34"/>
    <path d="M 115 428 C 120 435, 140 445, 170 452 L 175 440 C 150 435, 130 425, 115 428 Z" fill="#6E4823"/>

    <!-- Midsole Cushion (Thick White/Off-White) -->
    <path d="M 110 410 C 120 410, 220 448, 350 445 C 470 440, 540 380, 540 380 L 535 345 C 535 345, 450 398, 345 402 C 220 405, 125 365, 125 365 Z" fill="#F5F5F7"/>
    <!-- Midsole texture line -->
    <path d="M 140 390 C 220 420, 340 422, 450 390" stroke="#E2E2E6" stroke-width="2" fill="none"/>

    <!-- Upper Main Body (Dark Navy / Charcoal Black Seamless Textile) -->
    <path d="M 120 365 C 105 320, 135 240, 220 220 C 280 205, 320 180, 390 185 C 440 190, 515 260, 535 345 C 450 398, 345 402, 120 365 Z" fill="#1E2536"/>

    <!-- Texture / Grain Overlays on Upper -->
    <path d="M 150 350 C 220 380, 320 380, 420 355" stroke="#283248" stroke-width="30" fill="none" opacity="0.6"/>

    <!-- Heavy Protective Rubber Toe Cap (Dark Charcoal) -->
    <path d="M 120 365 C 105 320, 135 260, 195 250 C 190 280, 170 330, 120 365 Z" fill="#141924"/>

    <!-- Printed K2 Logo on Toe Cap -->
    <text x="142" y="348" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="0.5">K2</text>

    <!-- Padded Ankle Collar & Tongue Interior (Light Gray / White) -->
    <path d="M 370 188 C 390 155, 450 165, 485 220 C 475 235, 425 235, 385 210 Z" fill="#EAEAEA"/>
    <path d="M 380 195 C 395 170, 440 178, 470 220" stroke="#D0D0D5" stroke-width="4" fill="none"/>

    <!-- Tongue Center Strip & Tag -->
    <path d="M 285 210 C 315 200, 355 185, 380 195 L 360 225 C 335 215, 300 225, 285 210 Z" fill="#2B354A"/>

    <!-- White Tag Label on Tongue (K2 / LT 121) -->
    <g transform="translate(325, 185) rotate(-15)">
      <rect x="0" y="0" width="28" height="22" rx="3" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
      <text x="14" y="9" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#141924" text-anchor="middle">K2</text>
      <text x="14" y="15" font-family="Arial, sans-serif" font-weight="800" font-size="5" fill="#555555" text-anchor="middle">LT</text>
      <text x="14" y="19" font-family="Arial, sans-serif" font-weight="800" font-size="5" fill="#555555" text-anchor="middle">121</text>
    </g>

    <!-- BOA Lacing System Center Guide & Loops -->
    <path d="M 220 235 L 340 200" stroke="#4A5670" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
    <path d="M 235 255 L 330 220" stroke="#4A5670" stroke-width="3" fill="none"/>

    <rect x="250" y="225" width="16" height="8" rx="2" fill="#3B475F"/>
    <rect x="290" y="210" width="16" height="8" rx="2" fill="#3B475F"/>

    <!-- Lateral BOA Dial Assembly (Black Circular Dial) -->
    <g transform="translate(370, 215)">
      <!-- Dial Outer Base Shadow -->
      <circle cx="16" cy="16" r="18" fill="#0D111A"/>
      <!-- Dial Outer Ring (Grip Texture) -->
      <circle cx="16" cy="16" r="16" fill="#1A202C" stroke="#374151" stroke-width="2"/>
      <circle cx="16" cy="16" r="14" fill="#111827"/>
      <!-- Inner Dial Face -->
      <circle cx="16" cy="16" r="10" fill="#1F2937"/>
      <text x="16" y="19" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BOA</text>
    </g>

    <!-- Back Heel Loop & Side GORE-TEX / Brand Badge -->
    <rect x="480" y="230" width="18" height="8" rx="2" fill="#2B354A" transform="rotate(30 480 230)"/>
    <text x="481" y="236" font-family="Arial, sans-serif" font-weight="700" font-size="4" fill="#FFFFFF" transform="rotate(30 480 230)">GORE-TEX</text>
  </g>
</svg>
